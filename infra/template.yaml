AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TrustVote - Serverless Nonpartisan Election Information Dashboard & Bedrock Knowledge Base RAG

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        CANDIDATES_TABLE: !Ref CandidatesTable
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        BEDROCK_MODEL_ARN: "arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0"
        BEDROCK_KB_ID: !Ref BedrockKnowledgeBaseId
        DEMOCRACY_WORKS_API_KEY: !Ref DemocracyWorksApiKey
        POWERTOOLS_SERVICE_NAME: "trustvote-api"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment stage
  BedrockKnowledgeBaseId:
    Type: String
    Default: ""
    Description: Optional Amazon Bedrock Knowledge Base ID (if already provisioned)
  DemocracyWorksApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional API Key for Democracy Works Elections API (https://www.democracy.works/elections-api)

Resources:
  ############################################################
  # S3 Storage for Verified Documents & Metadata
  ############################################################
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "trustvote-verified-documents-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ############################################################
  # DynamoDB for Candidate & Ballot Profiles
  ############################################################
  CandidatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrustVote-Profiles-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  ############################################################
  # API Gateway HTTP API
  ############################################################
  TrustVoteHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - "*"
        MaxAge: 600

  ############################################################
  # Lambda API Backend
  ############################################################
  TrustVoteApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambda/
      Handler: handler.lambda_handler
      Description: TrustVote API Gateway router for search, candidate profiles, and Bedrock RAG
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CandidatesTable
        - S3ReadPolicy:
            BucketName: !Sub "trustvote-verified-documents-${AWS::AccountId}-${Environment}"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:RetrieveAndGenerate
                - bedrock:Retrieve
              Resource: "*"
      Events:
        SearchEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /search
            Method: GET
        CandidateDetailEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /candidate/{id}
            Method: GET
        CandidatesListEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /candidates
            Method: GET
        MeasureDetailEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /measure/{id}
            Method: GET
        MeasuresListEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /measures
            Method: GET
        TopicsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /topics
            Method: GET
        AskEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /ask
            Method: POST
        HealthCheckEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /health
            Method: GET
        ElectionsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /elections
            Method: GET
        AuthoritiesEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /authorities
            Method: GET
        BallotGetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /ballot
            Method: GET
        BallotPostEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref TrustVoteHttpApi
            Path: /ballot
            Method: POST

  ############################################################
  # CloudWatch Log Group
  ############################################################
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TrustVoteApiFunction}"
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL for TrustVote
    Value: !Sub "https://${TrustVoteHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  DocumentsBucketName:
    Description: S3 bucket name for knowledge base documents
    Value: !Ref DocumentsBucket
  CandidatesTableName:
    Description: DynamoDB table name for profiles
    Value: !Ref CandidatesTable
