version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci --prefer-offline || npm install
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/.next/cache/**/*
